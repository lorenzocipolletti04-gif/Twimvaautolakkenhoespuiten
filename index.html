<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Schade herstellen</title>

<style>
html,body{
  margin:0;
  padding:0;
  background:transparent;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
}

.btn{
  display:inline-flex;
  align-items:center;
  gap:10px;
  padding:12px 18px;
  border-radius:12px;
  border:0;
  background:#FFE160;
  color:#111;
  font-weight:900;
  cursor:pointer;
}

.btn:hover{ filter:brightness(.97); }

.modal{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.panel{
  width:min(760px,100%);
  background:#fff;
  border-radius:16px;
  box-shadow:0 25px 70px rgba(0,0,0,.30);
  overflow:hidden;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:16px;
  border-bottom:1px solid rgba(0,0,0,.08);
}

.title{
  margin:0;
  font-size:18px;
  font-weight:900;
}

.close{
  width:40px;
  height:40px;
  border-radius:10px;
  border:0;
  background:#f3f3f3;
  cursor:pointer;
  font-size:18px;
}

.body{
  padding:16px;
  max-height:65vh;
  overflow:auto;
}

ol{padding-left:18px;margin:0;}
li{margin:10px 0;}

.tip{
  margin-top:14px;
  padding:12px;
  border-radius:12px;
  background:rgba(255,204,0,.15);
  border:1px solid rgba(255,204,0,.35);
  font-weight:600;
}
</style>
</head>

<body>

<div id="app"></div>

<script>
const overlayMode = new URLSearchParams(location.search).get("overlay");

function send(msg){
  window.parent.postMessage(msg, "*");
}

if(!overlayMode){

  document.getElementById("app").innerHTML =
    '<button class="btn" onclick="send(\'TWIMVA_OPEN\')">🛠️ Hoe herstel ik mijn schade?</button>';

}else{

  document.getElementById("app").innerHTML = `
  <div class="modal">
    <div class="panel">
      <div class="header">
        <h3 class="title">Stappenplan: schade herstellen</h3>
        <button class="close" onclick="send('TWIMVA_CLOSE')">✕</button>
      </div>
      <div class="body">
        <ol>
          <li><strong>Schuren:</strong> schuur de beschadiging vlak (P320–P600).</li>
          <li><strong>Ontvetten:</strong> reinig met ontvetter en schone doek.</li>
          <li><strong>Primer:</strong> bij kaal metaal eerst primer.</li>
          <li><strong>Kleurlaag:</strong> 2–4 dunne lagen aanbrengen.</li>
          <li><strong>Blanke lak:</strong> voor glans en bescherming.</li>
          <li><strong>Uitharden:</strong> volledig laten drogen.</li>
          <li><strong>Afwerken:</strong> eventueel licht polijsten.</li>
        </ol>
        <div class="tip">Tip: werk stofvrij en spuit eerst een test op karton.</div>
      </div>
    </div>
  </div>`;
}
</script>

</body>
</html>
